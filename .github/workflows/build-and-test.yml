name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    paths:
      - 'terraform/**'
      - 'maintenance/**'
      - '.github/workflows/build-and-test.yml'

permissions: {}

jobs:
  terraform-plan-dev:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: Development
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Test maintenance Worker and approved hosts
        run: node --test maintenance/worker.test.mjs
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v2.0.0
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Test hostname origin TLS safeguards
        working-directory: terraform
        run: terraform test -no-color
