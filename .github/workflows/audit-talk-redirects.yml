name: Audit Talk Edge Redirects

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read existing forwarding rules without changing them
        shell: python
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          zone = json.loads(Path("terraform/zones/talkwithtiles.com.json").read_text())["zone_id"]
          assert re.fullmatch(r"[0-9a-f]{32}", zone)
          failures = []

          def read(path):
              request = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/zones/{zone}/{path}",
                  headers={"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({"endpoint": path, "http_status": error.code}))
                  failures.append(path)
                  return []
              if not payload.get("success"):
                  raise SystemExit("Cloudflare rejected the read-only inventory.")
              return payload["result"]

          def safe(value):
              if isinstance(value, dict):
                  return {key: safe(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [safe(item) for item in value]
              if isinstance(value, str) and value.startswith(("https://", "http://")):
                  url = urllib.parse.urlsplit(value)
                  return urllib.parse.urlunsplit((
                      url.scheme, url.netloc, url.path,
                      "REDACTED" if url.query else "", "REDACTED" if url.fragment else "",
                  ))
              return value

          pages = read("pagerules")
          print(json.dumps({"page_rule_count": len(pages)}))
          for rule in pages:
              if any(action["id"] == "forwarding_url" for action in rule["actions"]):
                  print(json.dumps(safe({"type": "page_rule", **{
                      key: rule.get(key) for key in ("id", "status", "priority", "targets", "actions")
                  }})))

          for ruleset in read("rulesets"):
              if ruleset["phase"] not in ("http_request_dynamic_redirect", "http_request_redirect"):
                  continue
              identifier = ruleset["id"]
              assert re.fullmatch(r"[0-9a-f]{32}", identifier)
              detail = read(f"rulesets/{identifier}")
              if not detail:
                  continue
              print(json.dumps(safe({
                  "type": "ruleset", "id": identifier, "phase": ruleset["phase"],
                  "rules": [{key: rule.get(key) for key in (
                      "id", "ref", "action", "enabled", "expression", "action_parameters"
                  )} for rule in detail.get("rules", [])],
              })))
          if failures:
              raise SystemExit("Read-only inventory is incomplete; no permissions or rules changed.")
