name: PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'deploy-dev') && contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Test maintenance Worker and approved hosts
        run: node --test maintenance/worker.test.mjs
      - name: Test adoption rehearsal authorization
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: frasermolyneux/actions/terraform-setup@terraform-setup/v1.1.0
        with:
          terraform-folder: "terraform"
          terraform_wrapper: "false"
      - name: Review Development without saving credential-bearing plan artifacts
        run: |
          set -euo pipefail
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config=backends/dev.backend.hcl
          terraform -chdir=terraform validate
          terraform -chdir=terraform plan -input=false -no-color -var-file=tfvars/dev.tfvars
      - name: Test hostname and legacy redirect safeguards
        working-directory: terraform
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          terraform test -no-color

  terraform-plan-and-apply-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'deploy-dev') && (contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'deploy-dev'))
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - uses: frasermolyneux/actions/terraform-plan-and-apply@terraform-plan-and-apply/v2.0.1
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  terraform-plan-prd:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'run-prd-plan') && (contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'run-prd-plan'))
    environment: Production
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_adopted_zone_keys: ${{ vars.CLOUDFLARE_ADOPTED_ZONE_KEYS || '[]' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: frasermolyneux/actions/terraform-setup@terraform-setup/v1.1.0
        with:
          terraform-folder: "terraform"
          terraform_wrapper: "false"
      - name: Review Production without saving credential-bearing plan artifacts
        run: |
          set -euo pipefail
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config=backends/prd.backend.hcl
          terraform -chdir=terraform validate
          terraform -chdir=terraform plan -input=false -no-color -var-file=tfvars/prd.tfvars

  xtremeidiots-adoption-plan:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    if: github.repository == 'frasermolyneux/platform-connectivity' && github.event.pull_request.number == 71 && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'frasermolyneux-cloudflare-zone-adoption' && github.event.pull_request.base.ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'rehearse-xtremeidiots-adoption' && github.actor == 'frasermolyneux'
    environment: Production
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: frasermolyneux/actions/terraform-setup@terraform-setup/v1.1.0
        with:
          terraform-folder: "terraform"
          terraform_wrapper: "false"
      - name: Review the explicitly approved adoption plan without saving it
        env:
          GH_TOKEN: ${{ github.token }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_adopted_zone_keys: ${{ vars.CLOUDFLARE_ADOPTED_ZONE_KEYS }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_AZUREAD: "true"
          ARM_USE_OIDC: "true"
        run: |
          set -euo pipefail
          adoption_keys="$(python3 .github/scripts/xtremeidiots_adoption_plan.py)"
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config=backends/prd.backend.hcl
          terraform -chdir=terraform validate
          adoption_keys="$(python3 .github/scripts/xtremeidiots_adoption_plan.py)"
          terraform -chdir=terraform plan -input=false -no-color -var-file=tfvars/prd.tfvars \
            -var="cloudflare_adopted_zone_keys=${adoption_keys}"
