name: Deploy or remove guarded strict origin TLS rule

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate and apply the exact rule addition or removal"
        required: true
        type: choice
        options:
          - add
          - remove

permissions: {}

concurrency:
  group: ${{ github.repository }}-prd
  cancel-in-progress: false

jobs:
  guarded-apply:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
      TLS_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: frasermolyneux/actions/terraform-setup@594500f81ee7fdb65616bba793f8cdf9025d57b2
        with:
          terraform-folder: terraform
          terraform_wrapper: "false"
      - name: Validate and apply the same saved plan
        run: |
          set -euo pipefail
          umask 077
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          test "$(git hash-object terraform/cloudflare_origin_tls.tf)" = "3be370d9fa3c90b8bdc8c995d11324115f8d963d"
          terraform -chdir=terraform init -input=false -lockfile=readonly -backend-config=backends/prd.backend.hcl
          terraform -chdir=terraform validate
          plan="$RUNNER_TEMP/strict-tls.tfplan"
          trap 'rm -f -- "$plan"' EXIT
          terraform -chdir=terraform plan -input=false -no-color -var-file=tfvars/prd.tfvars -out="$plan"
          digest=$(sha256sum "$plan" | cut -d' ' -f1)
          terraform -chdir=terraform show -json "$plan" | python3 terraform/scripts/guard_strict_tls_plan.py "$TLS_OPERATION"
          echo "$digest  $plan" | sha256sum --check --status
          test "$(git hash-object terraform/cloudflare_origin_tls.tf)" = "3be370d9fa3c90b8bdc8c995d11324115f8d963d"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          echo "Applying scope-validated saved plan SHA-256: $digest"
          terraform -chdir=terraform apply -input=false -auto-approve "$plan"
